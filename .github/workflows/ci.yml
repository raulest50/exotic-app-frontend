name: Verify frontend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run vite build
      - run: bun run test:ruta-proceso
  request-release:
    needs: verify
    if: github.event_name == 'push' && vars.DEPLOYMENT_DISPATCH_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: broker
        with:
          app-id: ${{ vars.DEPLOYMENT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_DISPATCH_PRIVATE_KEY }}
          owner: raulest50
          repositories: exotic-app-deployment
          permission-actions: write
      - name: Request a paired release; no direct VM access
        env:
          GH_TOKEN: ${{ steps.broker.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          gh api --method POST repos/raulest50/exotic-app-deployment/actions/workflows/release.yml/dispatches
          -f ref=main -f 'inputs[backend_sha]=main' -f "inputs[frontend_sha]=$SOURCE_SHA"
