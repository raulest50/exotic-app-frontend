# Successful pushes update only frontend staging through the deployment repository.
name: Verify frontend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run vite build
      - run: bun run test:ruta-proceso
      - name: Report staging connection
        if: github.event_name == 'push'
        env:
          DISPATCH_CONFIGURED: ${{ vars.DEPLOYMENT_DISPATCH_APP_CLIENT_ID != '' }}
        run: |
          if [ "$DISPATCH_CONFIGURED" = true ]; then
            echo 'Frontend verified; requesting the independent staging pipeline.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Frontend verified. Staging dispatch is pending GitHub App configuration; no deployment was requested.' >> "$GITHUB_STEP_SUMMARY"
          fi
  request-release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOYMENT_DISPATCH_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        id: broker
        with:
          client-id: ${{ vars.DEPLOYMENT_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOYMENT_DISPATCH_PRIVATE_KEY }}
          owner: raulest50
          repositories: exotic-app-deployment
          permission-actions: write
      - name: Request frontend staging build; no direct VM access
        env:
          GH_TOKEN: ${{ steps.broker.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          gh api --method POST repos/raulest50/exotic-app-deployment/actions/workflows/staging.yml/dispatches
          -f ref=main -f 'inputs[component]=frontend' -f "inputs[source_sha]=$SOURCE_SHA"
          -f "inputs[source_run_id]=$SOURCE_RUN_ID" -f "inputs[source_run_attempt]=$SOURCE_RUN_ATTEMPT"
